services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ground-jobs:/tmp/laz-ground-jobs
    # Not published: reachable only through the frontend's /api proxy.
    # Uncomment to hit it directly (e.g. http://localhost:8000/docs):
    # ports: ["8000:8000"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ground-jobs:
